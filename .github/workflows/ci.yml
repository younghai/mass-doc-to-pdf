name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Must run before setup-node: its `cache: pnpm` resolves the store path
      # through the pnpm executable. Version comes from the packageManager
      # field in package.json (pnpm@10.32.1).
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @hwptopdf/api exec prisma generate

      # @hwptopdf/shared resolves types from dist/, so typecheck/test/build in
      # the apps need it compiled first (same order as the Dockerfile).
      - name: Build shared package
        run: pnpm --filter @hwptopdf/shared build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Build
        run: pnpm -r build
